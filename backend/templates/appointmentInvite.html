<!DOCTYPE html>
<html>
<body style="font-family: Arial, sans-serif; color: #333;">
  <h2>New Visitor Appointment Request</h2>
  <p>Hello {{hostName}},</p>
  <p><strong>{{visitorName}}</strong> has requested an appointment with you.</p>
  <ul>
    <li><strong>Purpose:</strong> {{purpose}}</li>
    <li><strong>Date:</strong> {{scheduledDate}}</li>
    <li><strong>Time:</strong> {{scheduledTimeSlot}}</li>
  </ul>
  <p>Please log in to the Visitor Pass System to approve or reject this request.</p>
</body>
</html>
